<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Web Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: white;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #4CAF50;
    }

    .profile-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin: 10px 0;
      border: 3px solid #4CAF50;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    form {
      margin-top: 20px;
      text-align: left;
    }

    .form-section {
      margin: 20px 0;
    }

    .form-section h3 {
      margin-bottom: 10px;
      color: #333;
    }

    label {
      display: block;
      margin: 5px 0;
    }

    .btn-container {
      text-align: center;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .submit-btn {
      background-color: #4CAF50;
      color: white;
    }

    .submit-btn:hover {
      background-color: red;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
    }

    .reset-btn {
      background-color: red;
      color: white;
    }

    .reset-btn:hover {
      background-color: green;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Web Page</h1>

    <img src="https://i.pinimg.com/736x/00/5c/f2/005cf2c6e8cf4342238548e16300bf52.jpg" alt="Profile Picture" class="profile-img">

    <p>This is a demo web page with HTML, image, table, checkbox, and radio button.</p>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sneha</td>
          <td>22</td>
          <td>Tumkur</td>
        </tr>
        <tr>
          <td>Sriranjini</td>
          <td>23</td>
          <td>Bangalore</td>
        </tr>
        <tr>
          <td>Varsha</td>
          <td>25</td>
          <td>Mysore</td>
        </tr>
      </tbody>
    </table>

    <form id="myForm">
      <div class="form-section">
        <h3>Select Your Hobbies</h3>
        <label><input type="checkbox" name="hobby" value="dancing"> Dancing</label>
        <label><input type="checkbox" name="hobby" value="singing"> Singing</label>
        <label><input type="checkbox" name="hobby" value="coding"> Coding</label>
      </div>

      <div class="form-section">
        <h3>Select Gender</h3>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>

      <div class="btn-container">
        <button type="submit" class="submit-btn">Submit</button>
        <button type="reset" class="reset-btn">Reset</button>
      </div>
    </form>
  </div>
</body>
</html>
